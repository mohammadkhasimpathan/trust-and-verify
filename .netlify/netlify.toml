# Netlify Deployment Configuration — Trust & Verify
#
# IMPORTANT LIMITATION:
# Netlify static hosting only serves the contents of the `public/` directory.
# The Express backend (server.js) is NOT executed by Netlify.
# All /api/* routes will return 404 on a Netlify static deployment.
#
# To deploy the Express API to Netlify, the backend must be converted to
# Netlify Functions (serverless) or deployed separately to a Node.js host
# (e.g. Railway, Render, Fly.io, or a VPS).
# This migration is planned for a later deployment phase.
#
# For now, this file provides correct static-hosting configuration.

[build]
  # Publish the frontend static assets directory.
  # This path is relative to the repository root.
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Serve the app for any unmatched route so the single-page layout works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for static hosting
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service-worker must be served without browser caching so updates deploy immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"